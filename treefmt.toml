#:schema https://www.schemastore.org/treefmt.json

tree-root-file = ".git/config"
on-unmatched = "info"

excludes = ["*.lock"]

[formatter.nixfmt]
command = "nixfmt"
options = ["--strict", "--width=80", "--indent=2"]
includes = ["*.nix"]

[formatter.taplo]
command = "taplo"
options = ["format"]
includes = ["*.toml"]

[formatter.shfmt]
command = "shfmt"
options = ["--write"]
includes = ["*.sh", "*.bash", ".envrc"]

[formatter.prettier]
command = "prettier"
options = ["--write"]
includes = ["*.json"]
